[project]
name = "storecam"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shokhbek Shukurulloev", email = "114989696+Shokhbek07@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "lap>=0.5.14",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.1",
    "onnxslim>=0.1.99",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "ultralytics>=8.4.207",
]

[project.scripts]
storecam = "storecam:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
